[project]
name = "furniture-design"
version = "0.1.0"
description = "Skills, a knowledge base and the furniture-design@ quern package for designing furniture as a beginner, with the ledger of the decisions they are bound by."
requires-python = ">=3.12"
license = "AGPL-3.0-or-later AND CC-BY-NC-ND-4.0"
license-files = ["LICENSE", "LICENSE-DATA"]
dependencies = [
    "quern",
    "reportlab>=5.1.0",
    "shapely>=2.2.0",
    "numpy>=2.0",
    "pillow>=10.0",
    "pymupdf>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["furniture_design"]

[dependency-groups]
dev = ["pytest>=8.0.0", "testplan"]

[tool.uv.sources]
testplan = { git = "https://github.com/xag/testplan", rev = "fe886041c5c20d03d6b8f07137836572e0155e03" }
# Pinned by rev, always: quern is pre-1.0 and the doctrine is fork-or-republish.
quern = { git = "https://github.com/xag/quern", rev = "07eff6efc0625ee0613a083095db4e6b75be7284" }

[tool.pytest.ini_options]
pythonpath = ["."]
# Fail fast: stop at the first failure. testplan runs the tests whose code, data or packages
# changed since they passed, last failures first then the fastest, under a time budget, and
# keeps every run's times; `pytest --all` runs them all, once a day.
addopts = "-x"
