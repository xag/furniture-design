[project]
name = "furniture-design"
version = "0.1.0"
description = "Skills and tooling for designing furniture as a beginner, and the ledger of the decisions they are bound by."
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["quern", "pytest>=8.0.0", "pytest-testmon>=2.1"]

[tool.uv.sources]
# Pinned by rev, always: quern is pre-1.0 and the doctrine is fork-or-republish.
quern = { git = "https://github.com/xag/quern", rev = "bbcd9a6" }

[tool.pytest.ini_options]
pythonpath = ["."]
# Fail fast: stop at the first failure, run last time's failures first.
# First pass `pytest --testmon` (failed and changed tests), then the whole suite with `pytest`.
addopts = "-x --ff"
